<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner Studio Dentistico</title>
<meta name="description" content="Progetta in 3D lo studio dentistico partendo dalla planimetria.">
<meta name="theme-color" content="#0E6B70">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="proj-btn" id="projBtn" type="button" aria-label="Progetti">
      <span class="mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 3h14v14H3z"/><path d="M3 10h7V3M10 17v-4h7"/></svg>
      </span>
      <span class="proj-text">
        <span class="proj-kicker">Progetto</span>
        <span class="proj-name" id="projName">Caricamento…</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
    </button>
    <div class="seg view" id="viewSeg" role="group" aria-label="Vista">
      <button type="button" data-view="2d" aria-pressed="true" title="Pianta 2D (1)"><span data-ico="plan"></span><span class="lbl">Pianta</span></button>
      <button type="button" data-view="3d" aria-pressed="false" title="Vista 3D (2)"><span data-ico="cube"></span><span class="lbl">3D</span></button>
      <button type="button" data-view="walk" aria-pressed="false" title="Passeggiata (3)"><span data-ico="walk"></span><span class="lbl">Passeggiata</span></button>
    </div>
    <div class="seg phase" id="phaseSeg" role="group" aria-label="Fase">
      <button type="button" data-phase="fatto" aria-pressed="false" title="Stato di fatto"><span class="lbl">Stato di fatto</span></button>
      <button type="button" data-phase="confronto" aria-pressed="false" title="Demolizioni in giallo, nuove opere in rosso"><span class="lbl">Gialli e rossi</span></button>
      <button type="button" data-phase="progetto" aria-pressed="true" title="Progetto"><span class="lbl">Progetto</span></button>
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
      <span class="save-state" id="saveState" data-state="unsaved"><span class="dot"></span><span class="txt">Non salvato</span></span>
      <button class="icon-btn" id="undoBtn" type="button" title="Annulla (⌘Z)" aria-label="Annulla"><span data-ico="undo"></span></button>
      <button class="icon-btn" id="redoBtn" type="button" title="Ripeti (⇧⌘Z)" aria-label="Ripeti"><span data-ico="redo"></span></button>
      <button class="btn" id="exportBtn" type="button"><span data-ico="download"></span><span class="lbl-long">Esporta</span></button>
      <button class="icon-btn" id="panelBtn" type="button" title="Pannello" aria-label="Mostra o nascondi il pannello"><span data-ico="panel"></span></button>
      <button class="icon-btn" id="helpBtn" type="button" title="Comandi" aria-label="Comandi"><span data-ico="help"></span></button>
    </div>
  </header>

  <main class="main" id="main">
    <nav class="rail" id="rail" aria-label="Strumenti"></nav>
    <section class="stage" id="stage">
      <canvas id="plan"></canvas>
      <div id="view3d" hidden></div>
      <div class="opts" id="toolOpts"></div>
      <div class="zoom" id="zoomCtl">
        <button class="icon-btn" id="zoomOut" type="button" aria-label="Riduci"><span data-ico="minus"></span></button>
        <span class="scale-read" id="scaleRead">—</span>
        <button class="icon-btn" id="zoomIn" type="button" aria-label="Ingrandisci"><span data-ico="plus"></span></button>
        <button class="icon-btn" id="zoomFit" type="button" aria-label="Adatta alla finestra" title="Adatta (0)"><span data-ico="fit"></span></button>
      </div>
      <div class="hud3d" id="hud3d" hidden></div>
      <div class="hud3d-bottom" id="hud3dBottom" hidden></div>
      <div id="walkHud" hidden>
        <div class="walk-top" id="walkTop"></div>
        <div class="joystick" id="joystick"><div class="knob" id="knob"></div></div>
        <div class="minimap" id="minimap"><canvas id="miniCanvas"></canvas></div>
        <div class="walk-hint" id="walkHint">WASD o joystick per muoverti · trascina per guardarti intorno</div>
      </div>
      <div class="loading-3d" id="loading3d" hidden>Preparo la vista 3D…</div>
      <div class="err3d" id="err3d" hidden></div>
      <button class="btn primary fab" id="fabLib" type="button"><span data-ico="plus"></span>Arredi</button>
    </section>
    <aside class="panel" id="panel" aria-label="Pannello">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="lib" aria-selected="true">Arredi</button>
        <button type="button" role="tab" data-tab="props" aria-selected="false">Proprietà</button>
        <button type="button" role="tab" data-tab="rooms" aria-selected="false">Stanze</button>
        <button type="button" role="tab" data-tab="budget" aria-selected="false">Budget</button>
        <button type="button" role="tab" data-tab="project" aria-selected="false">Progetto</button>
        <button type="button" class="icon-btn panel-close" id="panelClose" aria-label="Chiudi pannello" style="margin-left:auto;width:32px;height:32px"><span data-ico="close"></span></button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <input type="file" id="fileBg" accept="image/*,application/pdf" hidden>
  <input type="file" id="fileJson" accept="application/json,.json" multiple hidden>
</div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
